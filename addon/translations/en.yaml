configuration:
  admin_password:
    name: Admin password (change this!)
    description: Password for the initial admin user. Always the source of truth for admin login — change it any time.
  allowed_phones:
    name: Allowed phone numbers
    description: Comma-separated phone numbers allowed to control via Yemot HaMashiach. Empty = phone control disabled.
  github_token:
    name: GitHub Token (migration only)
    description: Leave empty for local storage. Fill only to migrate settings from the old cloud system.
  github_owner:
    name: GitHub Owner (migration only)
    description: Repository owner — migration mode only.
  github_repo:
    name: GitHub Repo (migration only)
    description: Repository name — migration mode only.
