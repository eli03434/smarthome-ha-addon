name: Smart Home Controller
version: "1.0.6"
slug: smarthome
description: בקרת בית חכם — ממסרים, תזמון לפי זמנים הלכתיים, ניהול משתמשים והרשאות
url: https://github.com/eli03434/smarthome-ha-addon
# ── ארכיטקטורות נתמכות (Raspberry Pi 3/4/5 = aarch64, Mini-PC = amd64) ──
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# ── שירות MQTT המקומי של HA (Mosquitto) מוזרק אוטומטית ──
services:
  - mqtt:need
# ── גישה ל-API של HA (לשליטה עתידית בכל מכשירי HA, לא רק Tasmota) ──
homeassistant_api: true
# ── Ingress: התוסף מופיע בתפריט הצד של HA, עם אימות מובנה ──
ingress: true
ingress_port: 3000
panel_icon: mdi:home-automation
panel_title: בית חכם
# ── חשיפת פורט ישיר (אופציונלי — לגישה גם מחוץ ל-HA, למשל מהטלפון) ──
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: ממשק הבית החכם (גישה ישירה, מחוץ ל-Ingress)
options:
  # סיסמת האדמין הראשוני — חובה לשנות בכל התקנה!
  admin_password: "changeme"
  # מספרי טלפון מורשים לשליטה דרך "ימות המשיח", מופרדים בפסיק (אופציונלי)
  allowed_phones: ""
  # מיגרציה מהמערכת הישנה (GitHub) — השאר ריק לשמירה מקומית בלבד
  github_token: ""
  github_owner: ""
  github_repo: ""
schema:
  admin_password: password
  allowed_phones: str?
  github_token: str?
  github_owner: str?
  github_repo: str?
